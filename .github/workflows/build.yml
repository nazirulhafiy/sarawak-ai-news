name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve kit PIN
        id: kit_pin
        run: echo "sha=$(tr -d '[:space:]' < kit/PIN)" >> "$GITHUB_OUTPUT"
      - name: Checkout hub at kit PIN
        uses: actions/checkout@v4
        with:
          repository: nazirulhafiy/sarawak-news-hub
          ref: ${{ steps.kit_pin.outputs.sha }}
          path: .hub-kit-ref
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared kit sync
        run: python kit/sync.py --check --hub-path .hub-kit-ref
      - name: Check generated docs
        run: python3 kit/generate_docs.py --check
      - name: Validate published item sources
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit source dates
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            python scripts/audit_dates.py --changed-from HEAD^
          else
            python scripts/audit_dates.py
          fi
      - name: Audit one-line signals
        run: python scripts/audit_summaries.py
      - name: Build static site
        run: python scripts/build.py
      - name: Check analytics dist against registry
        run: python scripts/check_analytics_dist.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
